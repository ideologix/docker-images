name: Build images

on:
  push:
    branches: [main]
    paths: ["php/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["php/**", ".github/workflows/build.yml"]
  # Weekly rebuild picks up PHP and OS security patches inside the pinned base.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [laravel, laravel-ssr, wordpress]
    env:
      IMAGE: ghcr.io/ideologix/php
      TAG: 8.5-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: php
          target: ${{ matrix.target }}
          load: true
          tags: local/php:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=php:${{ env.TAG }}
            org.opencontainers.image.description=PHP 8.5 base (${{ matrix.target }}) on serversideup/php v5
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Smoke test
        run: bash php/smoke-test.sh local/php:${{ env.TAG }} ${{ matrix.target }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Moving tag (8.5-laravel) plus an immutable dated tag (8.5-laravel-20261013)
      # that apps pin, so a base change only reaches an app through its own PR.
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          dated="${TAG}-$(date -u +%Y%m%d)"
          for t in "$TAG" "$dated"; do
            docker tag "local/php:$TAG" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          echo "Pushed $IMAGE:$TAG and $IMAGE:$dated" >> "$GITHUB_STEP_SUMMARY"
