name: Build images

on:
  push:
    branches: [main]
    paths: ["php/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["php/**", ".github/workflows/build.yml"]
  # Weekly rebuild picks up PHP and OS security patches inside the pinned base.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ideologix/php

jobs:
  # One job per target and architecture, each on a native runner (no QEMU), so
  # the smoke test runs the image it is about to push on its own CPU. arm64 is
  # what Apple Silicon Macs (and Graviton/Ampere servers) pull.
  php:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [laravel, laravel-ssr, wordpress]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TAG: 8.5-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: php
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: local/php:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Smoke test
        run: bash php/smoke-test.sh local/php:${{ env.TAG }} ${{ matrix.target }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build again, all layers from the cache, pushed by digest only. The
      # merge job below stitches the two architectures into one tag.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: php
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=php:${{ env.TAG }}
            org.opencontainers.image.description=PHP 8.5 base (${{ matrix.target }}) on serversideup/php v5
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Moving tag (8.5-laravel) plus an immutable dated tag (8.5-laravel-20261013)
  # that apps pin, so a base change only reaches an app through its own PR.
  # Both are multi-arch indexes over the amd64 and arm64 images.
  publish:
    if: github.event_name != 'pull_request'
    needs: php
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [laravel, laravel-ssr, wordpress]
    env:
      TAG: 8.5-${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.target }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        working-directory: /tmp/digests
        run: |
          dated="${TAG}-$(date -u +%Y%m%d)"
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" -t "$IMAGE:$dated" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$dated"
          echo "Pushed $IMAGE:$TAG and $IMAGE:$dated (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
